ication delegated to SystemUser.</text><text fill="#000000" font-family="sans-serif" font-size="10.4" lengthAdjust="spacing" textLength="138.7242" x="1671.6" y="579.6992">role field is display-only string.</text><text fill="#000000" font-family="sans-serif" font-size="10.4" lengthAdjust="spacing" textLength="203.4805" x="1671.6" y="593.532">nextSkillsAssessmentDate auto = today+5yr</text></g><!--link RegisterUserUI to RegisterUserController--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" data-source-line="82" id="lnk19"><path codeLine="82" d="M779.832,162.6269 C730.776,191.2749 673.7774,224.559 624.1134,253.551" fill="none" id="RegisterUserUI-to-RegisterUserController" style="stroke:#181818;stroke-width:0.8;stroke-dasharray:5.6,5.6;"/><polygon fill="#181818" points="619.968,255.9709,627.7993,255.1046,623.4225,253.9543,624.5728,249.5775,619.968,255.9709" style="stroke:#181818;stroke-width:0.8;"/></g><!--link RegisterUserUI to ValidEmailDomains--><g class="link" data-entity-1="ent0003" data-entity-2="ent0014" data-link-type="dependency" data-source-line="83" id="lnk20"><path codeLine="83" d="M933.232,187.2109 C939.568,197.6829 945.032,208.7309 948.8,220.0109 C971.8,288.8029 997.664,329.6109 948.8,383.2109 C937.432,395.6829 661.128,402.9869 646.4,411.2109 C602.056,435.9709 571.6547,480.9095 552.1587,517.5495" fill="none" id="RegisterUserUI-to-ValidEmailDomains" style="stroke:#181818;stroke-width:0.8;stroke-dasharray:5.6,5.6;"/><polygon fill="#181818" points="549.904,521.7869,556.1111,516.9339,551.783,518.2557,550.4611,513.9276,549.904,521.7869" style="stroke:#181818;stroke-width:0.8;"/><text fill="#000000" font-family="sans-serif" font-size="10.4" lengthAdjust="spacing" textLength="69.3672" x="976.8" y="314.4336">checks domain</text></g><!--link RegisterUserController to AuthzRegistry--><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" data-link-type="dependency" data-source-line="84" id="lnk21"><path codeLine