2363,717.1392,790.2363" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="715.1392" x2="1114.3232" y1="790.2363" y2="790.2363"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.7744" x="727.1392" y="784.9736">Optional&lt;Aircraft&gt;</text></g><g class="message" data-entity-1="part3" data-entity-2="part6" id="msg17"><polygon fill="#181818" points="1257.6436,817.5273,1267.6436,821.5273,1257.6436,825.5273,1261.6436,821.5273" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="710.1392" x2="1263.6436" y1="821.5273" y2="821.5273"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.7344" x="717.1392" y="816.2646">ofIdentity(aircraft.aircraftModelId)</text></g><g class="message" data-entity-1="part6" data-entity-2="part3" id="msg18"><polygon fill="#181818" points="721.1392,848.8184,711.1392,852.8184,721.1392,856.8184,717.1392,852.8184" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="715.1392" x2="1268.6436" y1="852.8184" y2="852.8184"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.1816" x="727.1392" y="847.5557">Optional&lt;AircraftModel&gt;</text></g><path d="M715,865.8184 L715,961.8184 L1027,961.8184 L1027,875.8184 L1017,865.8184 L715,865.8184" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1017,865.8184 L1017,875.8184 L1027,875.8184 L1017,865.8184" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.498" x="721" y="884.8467">Returns FlightCharacteristics:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.1606" x="721" y="902.1377">maxFuelCapacity, serviceCeiling(m), cruiseSpeed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.9834" x="721" y="919.4287">serviceCeiling converted to feet.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.9033" x="721" y="936.7197">Falls back to defaults if no aircraft assigned:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.4624" x="721" y="954.0107">999999 kg / 45000 ft / 800 km/h.</text><g class="message" data-entity-1="part3" data-entity-2="part7" id="msg19"><polygon fill="#181818" points="1431.0361,986.5645,1441.0361,990.5645,1431.0361,994.5645,1435.0361,990.5645" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="710.1392" x2="1437.0361" y1="990.5645" y2="990.5645"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.1543" x="717.1392" y="985.3018">ofIdentity(plan.weatherDataId)</text></g><g class="message" data-entity-1="part7" data-entity-2="part3" id="msg20"><polygon fill="#181818" points="721.1392,1017.8555,711.1392,1021.8555,721.1392,1025.8555,717.1392,1021.8555" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="715.1392" x2="1442.0361" y1="1021.8555" y2="1021.8555"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.1943" x="727.1392" y="1016.5928">Optional&lt;WeatherData&gt;</text></g><path d="M715,1034.8555 L715,1113.8555 L1022,1113.8555 L1022,1044.8555 L1012,1034.8555 L715,1034.8555" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1012,1034.8555 L1012,1044.8555 L1022,1044.8555 L1012,1034.8555" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.2915" x="721" y="1053.8838">For each segment whose midpoint falls within</t