ss="entity" data-qualified-name="GMN11" data-source-line="53" id="ent0012"><path d="M416.5,310.1348 L416.5,415.1348 L381.19,419.1348 L416.5,423.1348 L416.5,527.627 A0,0 0 0 0 416.5,527.627 L753.9751,527.627 A0,0 0 0 0 753.9751,527.627 L753.9751,320.1348 L743.9751,310.1348 L416.5,310.1348 A0,0 0 0 0 416.5,310.1348" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M743.9751,310.1348 L743.9751,320.1348 L753.9751,320.1348 L743.9751,310.1348" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.4751" x="422.5" y="329.1631">Domain invariants (enforced by UserExceptionBuilder):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.1924" x="422.5" y="346.4541">- email unique, valid format, valid AlSafe domain</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="96.8335" x="422.5" y="363.7451">- name not blank</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.4624" x="422.5" y="381.0361">- phoneNumber exactly 9 digits, unique</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.3779" x="422.5" y="398.3271">- staffNumber not blank, unique</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.8125" x="422.5" y="415.6182">- securityClearanceExpiry must be future</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.1733" x="422.5" y="432.9092">- nextSkillsAssessmentDate = today + 5yr (auto)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="147.0498" x="422.5" y="450.2002">- active = true on creation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.8447" x="422.5" y="467.4912">- role = "BACKOFFICE_OPERATOR" on creation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.1606" x="429.7236" y="484.7822">(Admin can only create BackOffice Operators)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.186" x="422.5" y="502.0732">Note: password and authentication</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.8989" x="422.5" y="519.3643">managed by SystemUser (framework)</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="68" id="ent0015"><path d="M418,587.1348 L418,596.1348 L223.62,600.1348 L418,604.1348 L418,700.8809 A0,0 0 0 0 418,700.8809 L709.9116,700.8809 A0,0 0 0 0 709.9116,700.8809 L709.9116,597.1348 L699.9116,587.1348 L418,587.1348 A0,0 0 0 0 418,587.1348" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M699.9116,587.1348 L699.9116,597.1348 L709.9116,597.1348 L699.9116,587.1348" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.9961" x="424" y="606.1631">Accumulates all validation violations.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.5615" x="424" y="623.4541">Throws IllegalArgumentException only at</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.4053" x="424" y="640.7451">validate() &#8212; after all checks run.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.4624" x="424" y="658.0361">Keeps User constructor free of guard clauses.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.9116" x="424" y="675.3271">User is always validated BEFORE SystemUser</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.9561" x="424" y="692.6182">is created, preventing orphan records.</text></g><g class="entity" data-qualified-name="GMN17" data-source-line="77" id="ent0018"><path d="M365.5,120.1348 L365.5,156.1348 L330.65,160.1348 L365.5,164.1348 L365.5,199.2988 A0,0 0 0 0 365.5,199.2988 L622.7788,199.2988 A0,0 0 0 0 622.7788,199.2988 L622.7788,130.1348 L612.7788,120.1348 L365.5,120.1348 A0,0 0 0 0 365.5,120.1348" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M612.7788,120.1348 L612.7788,130.1348 L622.7788,130.1348 L612.7788,120.1348" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.2471" x="371.5" y="139.1631">Managed by EAPLI Framework.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.7534" x="371.5" y="156.4541">Stores credentials and roles.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.3779" x="371.5" y="173.7451">Created via UserManagementService,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.2788" x="371.5" y="191.0361">but ONLY after domain User is validated.</text></g><!--reverse link User to EmailAddress--><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" data-link-type="composition" data-source-line="46" id="lnk8"><path codeLine="46" d="M320,535.7948 C320,564.4948 320,581.8648 320,604.3948" fill="none" id="User-backto-EmailAddress" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="320,523.7948,316,529.7948,320,535.7948,324,529.7948,320,523.7948" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="7.23" x="317.4065" y="545.1281">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="7.23" x="312.2698" y="593.4406">1</text></g><!--link User to UserExceptionBuilder--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data-source-line="47" id="lnk9"><path codeLine="47" d="M169.25,523.7948 C169.25,548.7048 169.25,568.1248 169.25,589.1348" fill="none" id="User-to-UserExceptionBuilder" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="169.25,595.1348,173.25,586.1348,169.25,590.1348,165.25,586.1348,169.25,595.1348" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.918" x="54.25" y="555.4931">delegates validation</text></g><!--link SystemUser to User--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="association" data-source-line="50" id="lnk10"><path codeLine="50" d="M248,236.6448 C248,260.6448 248,287.5548 248,313.1548" fill="none" id="SystemUser-User" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.9854" x="148.1809" y="253.9331">linked by email</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="112.3472" x="135" y="271.2241">(username = email)</text></g><?plantuml-src VLRjRYet4FtFKupe7sWJH9f4K7GJQI4WHJS94TnKgbIfChkpYuknjxQN15r5waFq2Via7NitO61Jf6WtpF5yd3apnd8h4ExKcd49Zof10UEt67LkuT-__u6NUVVo0bf35g-cQSfZX6cEcbcbOOOPDvRUkPBjHiEikCoPPciGNABTvWXAswKA3B5Wni3t1j37USoqAcGoKaBfBr-YBDEOCOipfUpjBVnmrntr9_qIh7I2-ZFWzULLDEpLU_sLYGAdYpynzj19DEwFkgS-Zs3zwwj9TrZlSKALuAlIgx6qt6uTdFBitjLuhO5UHBteyghUyx3WWWxxFBkJgz7bgSS0ql-vrxleDTuRZPmSiGoXEOwU7-vX5nLQKM6NIB5ZtoHuO5lKxMRLWR8Rywsnk7ungA4kuHBgFZz1GI1901Z0I_KQM7FoHaSJiZvNhu5LAu66J3Dwpj465XPRld4-5ufiJ0OcRY9lRBKFhUy7LKTYpjATX5k-b4ScoRQcsc4dbwF2gvAFrHGMZEHHK6PZzuoIHACnWRdYOcurbrd8n599V2hM2mfGOpQM