14.5059 A0,0 0 0 0 1268.2144,514.5059 L1268.2144,307.0137 L1258.2144,297.0137 L961.5,297.0137 A0,0 0 0 0 961.5,297.0137" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1258.2144,297.0137 L1258.2144,307.0137 L1268.2144,307.0137 L1258.2144,297.0137" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.0425" x="967.5" y="316.042">Admin only creates BackOffice Operators.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.3252" x="967.5" y="333.333">(Other roles created by BackOffice Operator</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.2788" x="967.5" y="350.624">when adding collaborators/customers.)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="967.5" y="367.915">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.6162" x="967.5" y="385.2061">Order of operations:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.5361" x="967.5" y="402.4971">1. Build &amp; validate domain User FIRST</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.3125" x="978.3354" y="419.7881">via UserExceptionBuilder.validate()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.6533" x="978.3354" y="437.0791">-&gt; IllegalArgumentException on failure,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.6943" x="989.1709" y="454.3701">NO SystemUser created (no orphan)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.2808" x="967.5" y="471.6611">2. Register SystemUser in framework</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.8789" x="978.3354" y="488.9521">(credentials + BACKOFFICE_OPERATOR role)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.4917" x="967.5" y="506.2432">3. Persist domain User</text></g><g class="entity" data-qualified-name="GMN35" data-source-line="121" id="ent0036"><path d="M2083.5,719.5137 L2083.5,815.9688 L2384.8887,815.9688 L2384.8887,729.5137 L2374.8887,719.5137 L2083.5,719.5137" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2374.8887,719.5137 L2374.8887,729.5137 L2384.8887,729.5137 L2374.8887,719.5137" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.2134" x="2089.5" y="738.542">Does NOT hold password or admin flag.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.5806" x="2089.5" y="755.833">Authentication delegated to SystemUser.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.4053" x="2089.5" y="773.124">role field is display-only string.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.3506" x="2089.5" y="790.415">nextSkillsAssessmentDate auto = today+5yr</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="280.3887" x="2089.5" y="807.7061">All validation delegated to UserExceptionBuilder.</text></g><g class="entity" data-qualified-name="GMN38" data-source-line="129" id="ent0039"><path d="M2083.5,1063.5137 L2083.5,1142.6777 L2368.2451,1142.6777 L2368.2451,1073.5137 L2358.2451,1063.5137 L2083.5,1063.5137" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2358.2451,1063.5137 L2358.2451,1073.5137 L2368.2451,1073.5137 L2358.2451,1063.5137" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.9116" x="2089.5" y="1082.542">Accumulates violations in a list.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.397" x="2089.5" y="1099.833">validate() throws IllegalArgumentException</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.3008" x="2089.5" y="1117.124">with all messages joined by " | ".</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.7451" x="2089.5" y="1134.415">Keeps User class free of inline guard clauses.</text></g><!--link RegisterUserUI to RegisterUserController--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" data-source-line="92" id="lnk20"><path codeLine="92" d="M1049.71,197.6737 C971.98,239.0337 872.6768,291.8752 791.5668,335.0352" fill="none" id="RegisterUserUI-to-RegisterUserController" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="786.27,337.8537,796.0942,337.1571,790.684,335.5049,792.3362,330.0947,786.27,337.8537" style="stroke:#181818;stroke-width:1;"/></g><!--link RegisterUserUI to ValidEmailDomains--><g class="link" data-entity-1="ent0003" data-entity-2="ent0015" data-link-type="dependency" data-source-line="93" id="lnk21"><path codeLine="93" d="M1253.81,234.3137 C1267,252.4937 1278.56,272.3537 1286,293.0137 C1319.27,385.4237 1351.21,440.5637 1286,514.0137 C1283.78,516.5137 810.9,569.3437 808,571.0137 C753.17,602.5837 715.2054,658.3513 690.6854,703.8713" fill="none" id="RegisterUserUI-to-ValidEmailDomains" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="687.84,709.1537,695.6297,703.1271,690.2112,704.7517,688.5866,699.3331,687.84,709.1537" style="stroke:#181818;stroke-width